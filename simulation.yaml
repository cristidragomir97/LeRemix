ros_distro: jazzy
ros_domain_id: 0
registry: localhost:5000
# ros_apt_mirror: http://apt.core/ros2 
image_prefix: llmy_sim_cuda
base_image_override: nvidia/cuda:12.6.1-base-ubuntu24.04


rmw_implementation: zenoh
zenoh:
  router_image: eclipse/zenoh:latest
  router_port: 7447


hosts:
  - name: localhost
    ip: 127.0.0.1
    user: cdr 
    arch: amd64
    manager: true
    mount_root: /home/cdr/robocore-deploy

components:

  - name: rviz
    gui: true
    apt_packages:
      - ros-jazzy-rviz2
    runs_on: localhost
    source:
      - ros/src/llmy_description
      - ros/src/llmy_rviz
    entrypoint: ros2 launch llmy_rviz rviz.launch.py use_sim_time:=true

  - name: simulation
    gui: true
    nvidia: true
    volumes:
      - gz_fuel_cache:/root/.gz/fuel
    source:
      - ros/src/llmy_description
      - ros/src/llmy_control
      - ros/src/llmy_gazebo
    runs_on: localhost
    entrypoint: ros2 launch llmy_gazebo gazebo.launch.py 

  - name: xbox
    runs_on: localhost
    privileged: true
    source:
      - ros/src/llmy_description
      - ros/src/llmy_teleop_xbox
    entrypoint: ros2 launch llmy_teleop_xbox teleop_xbox.launch.py use_sim_time:=true
    devices:
      - /dev/input:/dev/input

  - name: rosboard
    runs_on: localhost
    apt_packages: []
    ports: 
      - "8888:8888"
    pip_packages:
      - tornado
      - simplejpeg
    repositories:
      - url: https://github.com/dheera/rosboard
        version: main
        folder: rosboard
    entrypoint: ros2 run rosboard rosboard_node

  - name: slam_nav
    runs_on: localhost
    source:
      - ros/src/llmy_description
      - ros/src/llmy_nav
    entrypoint: ros2 launch llmy_nav slam_nav.launch.py use_sim_time:=true

  - name: moveit
    runs_on: localhost
    source:
      - ros/src/llmy_description
      - ros/src/llmy_control
      - ros/src/llmy_moveit
    entrypoint: ros2 launch llmy_moveit moveit.launch.py use_sim_time:=true launch_rviz:=false

