# ros2_control hardware config that loads the ROS2ControlBridge plugin
ros2_control:
  ros__parameters:
    hardware:
      plugin: llmy_control_plugin/ROS2ControlBridge

      # Topics for communication with servo manager
      base_cmd_topic: /motor_manager/base_cmd
      arm_cmd_topic: /motor_manager/arm_cmd
      camera_cmd_topic: /motor_manager/camera_cmd
      state_topic: /motor_manager/joint_states

      # optional
      publish_if_unchanged: true

    joints:
      # Base joints — velocity command, position+velocity states
      # Motor IDs: 1=front_right, 2=back_right, 3=back_left, 4=front_left
      - name: front_right_wheel_joint
        command_interfaces: [velocity]
        state_interfaces: [position, velocity]
      - name: back_right_wheel_joint
        command_interfaces: [velocity]
        state_interfaces: [position, velocity]
      - name: front_left_wheel_joint
        command_interfaces: [velocity]
        state_interfaces: [position, velocity]
      - name: back_left_wheel_joint
        command_interfaces: [velocity]
        state_interfaces: [position, velocity]

      # Arm joints — position command, position state
      # Motor IDs: 5=base_rotation, 6=shoulder, 7=elbow, 8=wrist, 9=wrist_rotation, 10=gripper
      - name: "1"
        command_interfaces: [position]
        state_interfaces: [position]
      - name: "2"
        command_interfaces: [position]
        state_interfaces: [position]
      - name: "3"
        command_interfaces: [position]
        state_interfaces: [position]
      - name: "4"
        command_interfaces: [position]
        state_interfaces: [position]
      - name: "5"
        command_interfaces: [position]
        state_interfaces: [position]
      - name: "6"
        command_interfaces: [position]
        state_interfaces: [position]

      # Camera joint — position command, position state
      # Motor ID: 11=camera_tilt
      - name: camera_tilt
        command_interfaces: [position]
        state_interfaces: [position]
