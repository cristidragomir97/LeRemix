# Behavior Tree Navigator Configuration for LLMy Robot

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 0.1

    # Navigator plugins (Jazzy format)
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

    # BT file locations (relative to package share)
    default_nav_to_pose_bt_xml: nav_to_pose.xml
    default_nav_through_poses_bt_xml: nav_through_poses.xml

    # Goal blackboard ID
    goal_blackboard_id: goal
    goals_blackboard_id: goals
    path_blackboard_id: path

    # Error code names - must match BT xml error_code_id values
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
