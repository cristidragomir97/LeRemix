# AMCL Configuration for LLMy Robot
# Adaptive Monte Carlo Localization (particle filter)

amcl:
  ros__parameters:
    use_sim_time: false

    # Frame settings
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link

    # Particle filter parameters
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99

    # Update thresholds - when to run filter update
    update_min_d: 0.2                     # Update every 20cm translation
    update_min_a: 0.5                     # Or every 0.5 rad (~28 deg) rotation

    # Resampling
    resample_interval: 1
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    # Transform settings
    transform_tolerance: 0.5              # 500ms TF tolerance
    tf_broadcast: true

    # Scan settings
    scan_topic: /scan
    laser_max_range: 12.0
    laser_min_range: 0.0
    max_beams: 60

    # Differential drive motion model
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2                           # Rotation noise from rotation
    alpha2: 0.2                           # Rotation noise from translation
    alpha3: 0.2                           # Translation noise from translation
    alpha4: 0.2                           # Translation noise from rotation
    alpha5: 0.1                           # Translation noise

    # Laser model
    laser_model_type: likelihood_field
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0

    # Initial pose
    set_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
