# Velocity Smoother Configuration for LLMy Robot
# Smooths velocity commands to prevent jerky motion

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"

    # Velocity limits [vx, vy, wz]
    # Match controller limits
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.2, 0.0, -1.0]

    # Acceleration limits
    max_accel: [0.3, 0.0, 0.5]
    max_decel: [-0.3, 0.0, -0.5]

    # Deadband - velocities below this are zeroed
    deadband_velocity: [0.0, 0.0, 0.0]

    # Timeout - stop if no command received
    velocity_timeout: 1.0

    # Topic remappings handled in launch file
    odom_topic: "odom"
    odom_duration: 0.1
