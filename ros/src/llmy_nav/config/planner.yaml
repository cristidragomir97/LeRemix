# SmacPlanner2D Configuration for LLMy Robot
# Grid-based global path planner

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.5                      # Goal tolerance in meters
      downsample_costmap: false           # Don't downsample for small robot
      downsampling_factor: 1
      allow_unknown: false                # Don't plan through unknown space
      max_iterations: 1000000             # Maximum A* iterations
      max_on_approach_iterations: 1000
      max_planning_time: 2.0              # Max planning time in seconds
      cost_travel_multiplier: 2.0         # Prefer lower-cost paths
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3                     # Smoothness weight
        w_data: 0.2                       # Data fidelity weight
        tolerance: 1.0e-10
        do_refinement: true
