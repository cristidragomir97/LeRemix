servo_manager_node:
  ros__parameters:
    port: "/dev/ttyTHS1"
    baud: 1000000

    loc_enable: true     # Enable/disable locomotion motors
    arm_enable: false     # Enable/disable arm motors
    camera_enable: false  # Enable/disable camera motor

    # Motor IDs:
    # Locomotion (2 wheels): 1=right, 2=left
    # Arm (6 joints): 5=base_rotation, 6=shoulder, 7=elbow, 8=wrist, 9=wrist_rotation, 10=gripper
    # Camera (1 joint): 11=tilt
    loc_ids:    [1, 2]
    arm_ids:    [3, 4, 5, 6, 7, 8]
    camera_ids: [11]

    ticks_per_rev: 4096
    telemetry_rate: 50.0  # Reduced from 50Hz to reduce bus load

    # Motor telemetry (current, voltage, load, temperature per motor)
    motor_telemetry_enable: true  # Enable/disable individual motor telemetry
    motor_telemetry_rate: 50.0     # Hz - lower than main telemetry to reduce bus load

    # Acceleration parameters (0-255, lower = smoother acceleration)
    loc_accel:    [15, 15]        # Locomotion motors - reduced acceleration for smoother movement
    arm_accel:    [20, 20, 15, 15, 25, 25]  # Arm motors - smooth acceleration
    camera_accel: [15]                     # Camera motor - moderate acceleration

    # Speed scaling factors (0.0 to 1.0, lower = slower)
    loc_speed_scale: 1.0     # Locomotion speed scale
    arm_speed_scale: 0.5     # Normal arm speed
    camera_speed_scale: 1.0  # Camera speed

    # IMPROVED BRAKING CONFIGURATION
    # Options: "torque_disable", "velocity_ramp", "position_brake"
    brake_method: "torque_disable"  # Gentlest method to prevent power spikes
    velocity_ramp_time: 0.1  # Time to ramp velocity to zero (seconds)
    brake_acceleration: 100  # Acceleration for position braking method

    # CALIBRATION DATA (populated by scripts/calibrate_arm.py)
    # Run: python3 scripts/calibrate_arm.py --config <path_to_this_file>
    # These parameters define zero positions and joint limits in servo ticks
    arm_zero_positions: []  # Zero position for each arm joint (6 values)
    arm_min_limits: []      # Minimum position limits (6 values)
    arm_max_limits: []      # Maximum position limits (6 values)

    camera_zero_positions: []  # Zero position for camera joint (1 value)
    camera_min_limits: []      # Minimum position limits (1 value)
    camera_max_limits: []      # Maximum position limits (1 value)