version: '3.8'
networks:
  ros_net:
    driver: bridge
services:
  rosboard:
    image: qwiki.lan:5000/llmy/llmy_rosboard:latest
    networks:
      - ros_net
    ports:
      - "8888:8888"
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_DISTRO=jazzy
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - ZENOH_ROUTER_CHECK_ATTEMPTS=10
      - ZENOH_CONFIG_OVERRIDE=listen/endpoints=["tcp/0.0.0.0:0"];connect/endpoints=["tcp/zenoh_router:7447"]
    command: bash -lc "source /opt/ros/jazzy/setup.bash && source /ros_ws_common/install/setup.bash && source /vcs_ws/install/setup.bash && ros2 run rosboard rosboard_node "
    depends_on:
      - zenoh_router
  zenoh_router:
    image: eclipse/zenoh:1.7.1
    container_name: zenoh_router
    networks:
      - ros_net
    restart: unless-stopped
    ports:
      - "7447:7447"
    command: --listen tcp/0.0.0.0:7447
