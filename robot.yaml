ros_distro: jazzy
ros_domain_id: 0
registry: dragomirxyz
# ros_apt_mirror: http://apt.core/ros2 
image_prefix: llmy_sim_cuda
base_image_override: nvidia/cuda:12.6.1-base-ubuntu24.04

hosts:
  - name: odin
    ip: 127.0.0.1
    user: cdr 
    arch: amd64
    manager: true
    build_on_device: true
    mount_root: /home/cdr/robocore-deploy




rmw_implementation: zenoh

  # Optional Zenoh config
zenoh:
  router_image: eclipse/zenoh:1.7.1
  router_port: 7447


common_packages:
  - name: llmy_description
    source:
      - ros/src/llmy_description

components:

  - name: mcp
    source: 
      - ros/src/llmy_mcp
    runs_on: odin
    pip_packages:
      - fastmcp
    ports: 
      - "8765:8765"
    entrypoint: ros2 run llmy_mcp mcp_server --port 8765


  ### CAMERAS (Realsense + Wrist Webcam)
  - name: camera
    source: 
      - ros/src/llmy_camera
    runs_on: odin
    privileged: true
    entrypoint: ros2 launch llmy_camera camera.launch.py
    devices: 
      - /dev:/dev

  - name: motion
    source:
    - ros/src/llmy_description
    - ros/src/llmy_control
    - ros/src/llmy_control_plugin
    - ros/src/st3215_manager
    - ros/src/ddsm210_manager
    runs_on: odin
    pip_packages:
      - st3215
      - pyserial
    entrypoint: ros2 launch llmy_control motion.launch.py
    devices:
      - /dev/ttyACM2:/dev/ttyACM2
      - /dev/ttyACM4:/dev/ttyACM4
      - /dev/ttyACM3:/dev/ttyACM3
    optimisations:
      - shm: 1024m
      - mount_shm: true
      - ipc: host
      - pinned_cores: [0, 1]

  - name: imu
    source:
    - ros/src/llmy_imu
    runs_on: odin
    pip_packages:
      - smbus2
    entrypoint: ros2 launch llmy_imu imu.launch.py
    devices:
      - /dev/i2c-7:/dev/i2c-7

    
  - name: lidar
    runs_on: odin
    devices: 
      - /dev/ttyACM3:/dev/ttyACM3
    repositories:
      - url: https://github.com/Slamtec/rplidar_ros
        version: ros2
        folder: rplidar_ros
    entrypoint: ros2 launch rplidar_ros rplidar_c1_launch.py serial_port:=/dev/ttyACM3

  - name: rosboard
    runs_on: odin
    ports: 
      - "8888:8888"
    apt_packages: []
    pip_packages: 
      - tornado
      - simplejpeg
    repositories:
      - url: https://github.com/dheera/rosboard
        version: main
        folder: rosboard
    entrypoint: ros2 run rosboard rosboard_node

  - name: slam
    runs_on: odin
    source:
      - ros/src/llmy_slam
    entrypoint: ros2 launch llmy_slam online_mapping_launch.py 


  - name: xbox
    runs_on: odin
    privileged: true
    source:
      - ros/src/llmy_teleop_xbox
    entrypoint: ros2 launch llmy_teleop_xbox teleop_xbox.launch.py
    devices:
      - /dev/input:/dev/input
